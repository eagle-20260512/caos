# ca-egress:唯一有外网的容器。正向代理白名单=LLM API 域名;其余一律拒。
# tinyproxy 语义提醒:Allow/Deny 管的是「客户端来源」,目的地白名单走 Filter(URL 过滤)
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 64

# 客户端来源:仅内网容器(compose 内网段)
Allow 172.16.0.0/12
Allow 127.0.0.1

# 目的地白名单(URL 过滤;FilterDefaultDeny=默认全拒,只放 filter 文件里的域名)
Filter "/etc/tinyproxy/filter.conf"
FilterURLs On
FilterDefaultDeny Yes
FilterExtended On
FilterCaseSensitive Off

# CONNECT 只许 443( https 隧道最小面)
ConnectPort 443

LogLevel Info
