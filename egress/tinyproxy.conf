# ca-egress:唯一有外网的容器。正向代理白名单=LLM API 域名;其余一律拒。
# tinyproxy 配置(端口 8888,仅内网可达)
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 64

# 域名白名单:只有这些目的地可经本代理出网(按部署者所用 LLM 增删)
ConnectPort 443
Allow api.deepseek.com
Allow open.bigmodel.cn
Allow api.moonshot.cn

# 其余默认拒绝(tinyproxy:有 Allow 列表即白名单模式)
LogLevel Info
